# Versions checked live 2026-09-22. Exceptions noted inline.
[versions]
agp             = "9.4.1"       # stable 9.x; project was generated with this syntax
kotlin          = "2.2.0"       # confirmed stable
coreKtx         = "1.19.0"     # confirmed stable
appcompat       = "1.7.0"      # unverified for 2026-09; was 1.7.0 mid-2025 — check on sync
junit           = "4.13.2"
junitAndroidExt = "1.1.5"
espressoCore    = "3.5.1"
composeBom              = "2026.09.00"  # confirmed stable
activityCompose         = "1.10.1"     # confirmed stable
hilt                    = "2.56.2"     # confirmed stable — KSP plugin wired in Phase 2
navigationCompose       = "2.10.1"     # confirmed stable
lifecycleViewmodelCompose = "2.11.0"  # confirmed stable
mavsdk          = "3.17.4"     # confirmed latest stable (Aug 2026) — was 3.0.0, updated after research
coroutines      = "1.9.0"      # unverified for 2026-09; was stable Aug 2025 — check on sync
ksp             = "2.2.0-2.0.2" # confirmed stable for Kotlin 2.2.0

[libraries]
# AndroidX core
androidx-core-ktx  = { group = "androidx.core",     name = "core-ktx",  version.ref = "coreKtx"  }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }

# Compose BOM — child library versions come from the BOM, no version needed here
compose-bom               = { group = "androidx.compose",          name = "compose-bom",          version.ref = "composeBom" }
compose-ui                = { group = "androidx.compose.ui",        name = "ui"                    }
compose-ui-tooling        = { group = "androidx.compose.ui",        name = "ui-tooling"            }
compose-ui-tooling-preview= { group = "androidx.compose.ui",        name = "ui-tooling-preview"    }
compose-ui-test-manifest  = { group = "androidx.compose.ui",        name = "ui-test-manifest"      }
compose-material3         = { group = "androidx.compose.material3", name = "material3"             }
activity-compose          = { group = "androidx.activity",          name = "activity-compose",     version.ref = "activityCompose" }

# Lifecycle
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodelCompose" }
lifecycle-runtime-compose   = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose",   version.ref = "lifecycleViewmodelCompose" }

# Navigation
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# Hilt — Phase 2: add ksp plugin to libs.versions.toml + apply in app/build.gradle.kts
hilt-android          = { group = "com.google.dagger", name = "hilt-android",          version.ref = "hilt" }
hilt-android-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt",  name = "hilt-navigation-compose", version = "1.2.0" }

# MAVSDK
mavsdk        = { group = "io.mavsdk", name = "mavsdk",        version.ref = "mavsdk" }
mavsdk-server = { group = "io.mavsdk", name = "mavsdk-server", version.ref = "mavsdk" }
# RxJava 2 — MAVSDK-Java uses RxJava 2 throughout (Flowable/Single/Completable)
rxjava2                = { group = "io.reactivex.rxjava2",      name = "rxjava",                    version = "2.2.21" }
rxandroid2             = { group = "io.reactivex.rxjava2",      name = "rxandroid",                 version = "2.1.1"  }
rxkotlin2              = { group = "io.reactivex.rxjava2",      name = "rxkotlin",                  version = "2.4.0"  }
kotlinx-coroutines-rx2 = { group = "org.jetbrains.kotlinx",    name = "kotlinx-coroutines-rx2",    version.ref = "coroutines" }

# Coroutines
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

# Testing
junit                 = { group = "junit",              name = "junit",        version.ref = "junit"           }
androidx-junit        = { group = "androidx.test.ext",  name = "junit",        version.ref = "junitAndroidExt" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

[plugins]
android-application = { id = "com.android.application",             version.ref = "agp"    }
android-library     = { id = "com.android.library",                 version.ref = "agp"    }
kotlin-android      = { id = "org.jetbrains.kotlin.android",        version.ref = "kotlin" }
kotlin-jvm          = { id = "org.jetbrains.kotlin.jvm",            version.ref = "kotlin" }
compose-compiler    = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp  = { id = "com.google.devtools.ksp",        version.ref = "ksp"  }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
